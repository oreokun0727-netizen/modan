<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModanChat - Realtime DB & Gemini AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; display: flex; height: 100vh; justify-content: center; align-items: center; }
    .container { width: 100%; max-width: 500px; height: 100vh; display: flex; flex-direction: column; background: #1e1e1e; }
    header { padding: 15px; background: #2d2d2d; display: flex; justify-content: space-between; align-items: center; }
    .status { font-size: 0.8rem; color: #4caf50; }
    .auth-box { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    input, button { padding: 12px; border-radius: 8px; border: none; font-size: 1rem; }
    input { background: #333; color: #fff; }
    button { background: #007bff; color: #fff; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; word-break: break-word; }
    .msg.me { background: #007bff; align-self: flex-end; }
    .msg.other { background: #333; align-self: flex-start; }
    .msg.ai { background: #6c5ce7; align-self: flex-start; }
    .sender-name { font-size: 0.75rem; color: #aaa; margin-bottom: 3px; }
    .input-area { padding: 15px; background: #2d2d2d; display: flex; gap: 10px; }
    .input-area input { flex: 1; }
    .hidden { display: none !important; }
  </style>

  <!-- Firebase SDK (v9/v10 Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h2>ModanChat</h2>
      <div id="userInfo" class="status">未ログイン</div>
    </header>

    <!-- ログイン・新規登録画面 -->
    <div id="authScreen" class="auth-box">
      <h3>ログイン / 新規登録</h3>
      <input type="text" id="usernameInput" placeholder="ユーザー名を入力 (例: admin, taro)">
      <button onclick="login()">チャットを始める</button>
    </div>

    <!-- チャット画面 -->
    <div id="chatScreen" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
      <div class="chat-box" id="chatBox"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="メッセージを入力... (@ai でGeminiに質問)">
        <button onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>

  <script>
    // --- Firebase 設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBS-SR6GzSSavdj1BXaJix5nnaEG2H0JQ4",
      authDomain: "modanchat-db.firebaseapp.com",
      databaseURL: "https://modanchat-db-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "modanchat-db",
      storageBucket: "modanchat-db.firebasestorage.app",
      messagingSenderId: "705841890409",
      appId: "1:705841890409:web:9a12bc09110c753809cef8",
      measurementId: "G-B5RH1888K9"
    };

    // Gemini API Key (GitHubコードに記載済みのキー)
    const GEMINI_API_KEY = "AIzaSyBS-SR6GzSSavdj1BXaJix5nnaEG2H0JQ4";

    // Firebase 初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";

    // ログイン処理
    function login() {
      const username = document.getElementById("usernameInput").value.trim();
      if (!username) return alert("ユーザー名を入力してください");
      
      currentUser = username;
      document.getElementById("userInfo").innerText = `ログイン中: ${currentUser}`;
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("chatScreen").classList.remove("hidden");

      // リアルタイムでメッセージ変更を監視（PC・スマホ両方に即時反映）
      db.ref("messages").on("child_added", (snapshot) => {
        const data = snapshot.val();
        displayMessage(data.sender, data.text, data.isAi);
      });
    }

    // メッセージ送信
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";

      // Firebase にメッセージを追加保存
      db.ref("messages").push({
        sender: currentUser,
        text: text,
        timestamp: Date.now(),
        isAi: false
      });

      // @ai または AI宛のメッセージの場合、Gemini APIを呼び出す
      if (text.includes("@ai") || text.toLowerCase().includes("gemini")) {
        callGeminiApi(text);
      }
    }

    // メッセージ画面表示
    function displayMessage(sender, text, isAi) {
      const chatBox = document.getElementById("chatBox");
      const msgDiv = document.createElement("div");
      
      msgDiv.classList.add("msg");
      if (isAi) {
        msgDiv.classList.add("ai");
      } else if (sender === currentUser) {
        msgDiv.classList.add("me");
      } else {
        msgDiv.classList.add("other");
      }

      msgDiv.innerHTML = `<div class="sender-name">${sender}</div>${text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Gemini API 呼び出し
    async function callGeminiApi(userPrompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }]
          })
        });

        const data = await response.json();
        const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Geminiからの応答を取得できませんでした。";

        // AIの返信も Firebase に保存してリアルタイム全共有
        db.ref("messages").push({
          sender: "Gemini AI",
          text: aiText,
          timestamp: Date.now(),
          isAi: true
        });

      } catch (err) {
        console.error("Gemini API Error:", err);
      }
    }
  </script>
</body>
</html>
