<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModanChat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; justify-content: center; align-items: center; }
    
    .container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    
    header { padding: 18px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h2 { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status { font-size: 0.8rem; padding: 4px 10px; background: #334155; border-radius: 20px; color: #38bdf8; font-weight: 600; }
    
    .auth-box { padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; justify-content: center; flex: 1; }
    .auth-box h3 { text-align: center; margin-bottom: 10px; color: #f1f5f9; }
    
    input { padding: 14px 16px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #38bdf8; }
    
    button { padding: 14px; border-radius: 12px; border: none; font-size: 0.95rem; font-weight: 600; background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
    
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; word-break: break-word; font-size: 0.95rem; line-height: 1.4; position: relative; }
    .msg.me { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.other { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
    .msg.ai { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
    
    .sender-name { font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
    .msg.me .sender-name { color: #93c5fd; text-align: right; }
    .msg.ai .sender-name { color: #c4b5fd; }
    
    .input-area { padding: 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
    .input-area input { flex: 1; }
    .hidden { display: none !important; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h2>ModanChat</h2>
      <div id="userInfo" class="status">未ログイン</div>
    </header>

    <!-- ログイン画面 -->
    <div id="authScreen" class="auth-box">
      <h3>アカウントログイン</h3>
      <input type="text" id="usernameInput" placeholder="ユーザー名を入力 (例: admin, taro)">
      <button onclick="login()">チャットを始める</button>
    </div>

    <!-- チャット画面 -->
    <div id="chatScreen" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
      <div class="chat-box" id="chatBox"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="メッセージを入力... (@ai でGeminiに質問)" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>

  <script>
    // --- Firebase 設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBS-SR6GzSSavdj1BXaJix5nnaEG2H0JQ4",
      authDomain: "modanchat-db.firebaseapp.com",
      databaseURL: "https://modanchat-db-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "modanchat-db",
      storageBucket: "modanchat-db.firebasestorage.app",
      messagingSenderId: "705841890409",
      appId: "1:705841890409:web:9a12bc09110c753809cef8",
      measurementId: "G-B5RH1888K9"
    };

    const GEMINI_API_KEY = "AIzaSyBS-SR6GzSSavdj1BXaJix5nnaEG2H0JQ4";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";

    function login() {
      const username = document.getElementById("usernameInput").value.trim();
      if (!username) return alert("ユーザー名を入力してください");
      
      currentUser = username;
      document.getElementById("userInfo").innerText = currentUser;
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("chatScreen").classList.remove("hidden");

      // メッセージをリアルタイム監視
      db.ref("messages").on("child_added", (snapshot) => {
        const data = snapshot.val();
        displayMessage(data.sender, data.text, data.isAi);
      });
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";

      db.ref("messages").push({
        sender: currentUser,
        text: text,
        timestamp: Date.now(),
        isAi: false
      });

      if (text.includes("@ai") || text.toLowerCase().includes("gemini")) {
        callGeminiApi(text);
      }
    }

    function displayMessage(sender, text, isAi) {
      const chatBox = document.getElementById("chatBox");
      const msgDiv = document.createElement("div");
      
      msgDiv.classList.add("msg");
      if (isAi) {
        msgDiv.classList.add("ai");
      } else if (sender === currentUser) {
        msgDiv.classList.add("me");
      } else {
        msgDiv.classList.add("other");
      }

      msgDiv.innerHTML = `<div class="sender-name">${sender}</div>${text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function callGeminiApi(userPrompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userPrompt }] }]
          })
        });

        const data = await response.json();
        const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Geminiからの応答を取得できませんでした。";

        db.ref("messages").push({
          sender: "Gemini AI",
          text: aiText,
          timestamp: Date.now(),
          isAi: true
        });

      } catch (err) {
        console.error("Gemini API Error:", err);
      }
    }
  </script>
</body>
</html>
